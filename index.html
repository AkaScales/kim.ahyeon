<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim Ahyeonji</title>
<meta name="description" content="Your bio-link page">

<style>
  :root{
    --ink:#1a0f14;
    --ink-soft:#241419;
    --paper:#f6ecee;
    --rose:#e8628a;
    --rose-deep:#d94c78;
    --gold:#e8628a;
    --line:rgba(246,236,238,0.14);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:
      radial-gradient(circle at 50% 0%, #2a1620 0%, var(--ink) 60%);
    color:var(--paper);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 40px;
  }

  .page{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar-ring{
    width:150px;
    height:150px;
    border-radius:50%;
    padding:5px;
    background:var(--rose);
    margin-bottom:22px;
  }
  .avatar-ring img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--ink);
  }

  .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:2rem;
    letter-spacing:-0.01em;
  }
  .name em{ color:var(--rose); font-style:italic; font-weight:500; }

  .handle{
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:rgba(246,236,238,0.55);
    margin-top:6px;
    letter-spacing:0.02em;
  }

  .bio{
    margin-top:14px;
    font-size:0.95rem;
    line-height:1.55;
    color:rgba(246,236,238,0.72);
    max-width:340px;
  }

  .links{
    width:100%;
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:15px 20px;
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--paper);
    text-decoration:none;
    font-weight:500;
    font-size:0.97rem;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link-btn:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
    background:#20242f;
  }
  .link-btn:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .link-btn .icon{
    width:22px;
    height:22px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-btn .icon svg{ width:100%; height:100%; }
  .link-btn .label{ flex:1; text-align:left; }
  .link-btn .arrow{ opacity:0.4; font-size:1.1rem; }

  .link-btn.featured{
    background:var(--rose);
    border:none;
    border-radius:44px;
    padding:10px 26px 10px 10px;
    font-size:1.05rem;
    font-weight:700;
    color:#fff;
  }
  .link-btn.featured:hover{
    background:var(--rose-deep);
    border-color:transparent;
  }
  .link-btn.featured .icon{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.6);
  }
  .link-btn.featured .icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .link-btn.featured .icon svg{
    width:22px;
    height:22px;
    color:#fff;
  }
  .link-btn.featured .arrow{ display:none; }

  .section-label{
    width:100%;
    text-align:left;
    margin-top:44px;
    margin-bottom:14px;
    font-family:var(--font-mono);
    font-size:0.75rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(246,236,238,0.45);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .gallery{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
    display:block;
  }

  footer{
    margin-top:48px;
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:rgba(246,236,238,0.35);
  }
